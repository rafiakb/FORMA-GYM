<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121916"><title>FORMA — Reset Password</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0f1713;color:#f3f7ec;font:16px/1.5 system-ui,sans-serif;padding:20px}.card{width:min(450px,100%);padding:clamp(24px,5vw,46px);border-radius:24px;background:#1b2a21;border:1px solid #334538;box-shadow:0 18px 80px #0004}.mark{font-weight:900;font-size:28px;color:#c4f070}.eyebrow{letter-spacing:.18em;font-size:11px;font-weight:800;color:#a5c0a3}.title{font-size:32px;letter-spacing:-1px;margin:12px 0}p{color:#a9b8aa}label{display:block;font-size:14px;font-weight:700;margin:21px 0 7px}input{padding:15px;color:#f5f6f1;background:#0f1713;border:1px solid #526453;border-radius:10px;width:100%;font:inherit}button{width:100%;border:0;border-radius:11px;padding:15px 18px;margin-top:20px;background:#d4f993;color:#1c281d;font-weight:800;font:800 15px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#d4f993}.error{color:#ffc2ac;white-space:pre-wrap}.success{color:#d4f993}</style></head><body><div class="card"><div class="mark">f<span style="color:#fff">.</span></div><div class="eyebrow">FORMA · ACCOUNT SECURITY</div><h1 class="title">Atur ulang password.</h1><p id="status">Memvalidasi tautan reset password...</p><form id="form" hidden><label for="password">Password baru (minimal 8 karakter)</label><input id="password" autocomplete="new-password" type="password" required minlength="8"><label for="confirm">Ulangi password baru</label><input id="confirm" autocomplete="new-password" type="password" required minlength="8"><button id="save" type="submit">Simpan password baru</button></form><p><a href="./index.html">Kembali ke login</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>
(async()=>{const status=document.querySelector('#status'),form=document.querySelector('#form');try{const cfg=window.FORMA_CONFIG;if(!cfg.supabaseUrl.startsWith('https://')||cfg.supabaseAnonKey.includes('PASTE_'))throw Error('Website belum terhubung ke Supabase.');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{detectSessionInUrl:true,persistSession:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw Error('Tautan tidak valid atau sudah kedaluwarsa. Minta tautan reset baru dari halaman login.');status.textContent='Masukkan password baru untuk akunmu.';form.hidden=false;form.addEventListener('submit',async e=>{e.preventDefault();const pwd=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value,btn=document.querySelector('#save');if(pwd!==confirm){status.textContent='Kedua password tidak sama.';status.className='error';return}btn.disabled=true;try{const r=await client.auth.updateUser({password:pwd});if(r.error)throw r.error;await client.auth.signOut();status.textContent='Password berhasil diperbarui. Silakan login kembali.';status.className='success';form.hidden=true;}catch(err){status.textContent=err.message;status.className='error';}finally{btn.disabled=false;}});}catch(err){status.textContent=err.message;status.className='error';}})();
</script></body></html>
